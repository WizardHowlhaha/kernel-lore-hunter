name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package, frontmatter and script checks
        run: bash scripts/selftest.sh

      - name: Agent Skills spec validation
        continue-on-error: true
        run: |
          npm install -g @agentskills/skills-ref
          skills-ref validate .

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Python syntax
        run: python3 -m py_compile scripts/lore.py scripts/patchew.py

      - name: ShellCheck
        continue-on-error: true
        uses: ludeeus/action-shellcheck@master
        with:
          files: 'install.sh uninstall.sh scripts/*.sh'
          severity: warning

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.sh --help
        run: ./install.sh --help

      - name: install.sh --dry-run
        run: ./install.sh --dry-run

      # The installer only links agents it can see on the machine, so the
      # fake home needs the config directories a real install would have.
      - name: Install into a throwaway HOME
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME/.claude" "$HOME/.codex"
          ./install.sh
          test -f "$HOME/.agents/skills/kernel-lore-hunter/SKILL.md"
          test -L "$HOME/.claude/skills/kernel-lore-hunter"
          test -L "$HOME/.codex/skills/kernel-lore-hunter"

      # An explicit --agent installs even when the agent was not detected.
      - name: An explicit agent is installed without being detected
        run: |
          export HOME="$RUNNER_TEMP/barehome"
          mkdir -p "$HOME"
          ./install.sh -a cursor
          test -L "$HOME/.cursor/skills/kernel-lore-hunter"
          test -f "$HOME/.agents/skills/kernel-lore-hunter/SKILL.md"

      - name: The installed copy passes its own self-test
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          bash "$HOME/.agents/skills/kernel-lore-hunter/scripts/selftest.sh"

      - name: Uninstall removes what it installed
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          ./uninstall.sh --purge
          test ! -e "$HOME/.agents/skills/kernel-lore-hunter"
          test ! -e "$HOME/.claude/skills/kernel-lore-hunter"
          test ! -e "$HOME/.codex/skills/kernel-lore-hunter"
